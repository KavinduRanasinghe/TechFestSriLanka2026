<style>
:root{--bg:#f4f5f7;--pn:#fff;--tx:#14181f;--mu:#667085;--ac:#d98a00;--bd:#dde1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--pn:#151b24;--tx:#e6e9ef;--mu:#8a94a6;--ac:#ffc233;--bd:#262e3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--pn:#151b24;--tx:#e6e9ef;--mu:#8a94a6;--ac:#ffc233;--bd:#262e3a;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:330px 1fr;height:100%}
#side{background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:12px}
#vp{position:relative;min-width:0;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}
h1{font-size:16px;margin:0 0 2px}.mu{color:var(--mu);font-size:12px}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:14px 0 4px}
.row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--bd)}
.row.sel{background:rgba(255,194,51,.15)}.row label{flex:1;cursor:pointer;display:flex;gap:6px;align-items:center}
.row b{font-weight:500}button{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;cursor:pointer}
.row button{padding:1px 7px;min-width:26px}button:hover,button.on{border-color:var(--ac)}
.g{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#views,#zm{position:absolute;display:flex;gap:5px;flex-wrap:wrap}#views{top:8px;left:8px;right:70px}#zm{top:8px;right:8px;flex-direction:column}
#views button,#zm button,#info{background:rgba(13,17,23,.78);color:#fff;border-color:#3a4456}
#views button.on{background:#d98a00;border-color:#d98a00}
#info{position:absolute;left:8px;bottom:8px;padding:6px 10px;border:1px solid #3a4456;border-radius:8px;max-width:70%}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:58% 42%}#side{order:2;border-right:0;border-top:1px solid var(--bd)}}
</style></head><body>
